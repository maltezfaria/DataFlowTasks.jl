name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
# cancel the runs of a branch superseded by a newer push; on main, every commit
# gets its own group so that none of its runs is skipped
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    permissions:
      actions: write # allow julia-actions/cache to delete old caches
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: 4
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true # optional (default = false)
          token: ${{ secrets.CODECOV_TOKEN }} # required
  docs:
    name: Documentation
    runs-on: ubuntu-latest # 4 vCPUs on public repositories
    env:
      # 2 worker threads (plus the interactive thread) fit the runner, so that the
      # traces of the examples are not distorted by oversubscription
      JULIA_NUM_THREADS: 2
    permissions:
      actions: write # allow julia-actions/cache to delete old caches
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
      - uses: julia-actions/cache@v3
      - name: Install dependencies
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build and deploy
        run: julia --project=docs/ docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run examples 
        # only track coverage from examples if we are on main branch
        if: github.ref == 'refs/heads/main' 
        run: julia --project=docs --code-coverage=user docs/run_examples.jl
      - uses: julia-actions/julia-processcoverage@v1
        if: github.ref == 'refs/heads/main'
      - uses: codecov/codecov-action@v7
        if: github.ref == 'refs/heads/main'
        with:
          fail_ci_if_error: true # optional (default = false)
          token: ${{ secrets.CODECOV_TOKEN }} # required
      - name: Check README.md consistency
        run: diff -u README.md docs/src/readme/README.md
